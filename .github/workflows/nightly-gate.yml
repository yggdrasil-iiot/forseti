name: nightly unsharded core gate
# The same core gate in one unsharded run (every assertion, scenario and cut in one JVM): the equivalence check for the sharded
# layout of ci.yml. Not a pull-request check; it runs once a day and on demand.
on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  gate:
    name: core gate, unsharded
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {path: forseti}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: {java-version: '17.0.21', distribution: temurin, cache: maven}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.13.18'}
      - name: Install the oracle
        working-directory: forseti/oracle
        run: python -m pip install -e ".[dev]"
      - name: Build the jar
        working-directory: forseti
        run: mvn -B -ntp install -DskipTests
      - name: Core-input key
        working-directory: forseti
        run: echo "FORSETI_INPUT_KEY=$(bash scripts/core-input-key.sh)" >> "$GITHUB_ENV"
      # The gate's own JVM gets an explicit 6g heap (the runner default is a quarter of its RAM); the harness children keep the heaps the
      # gate gives them on their command lines. The step records the gate JVM's GC log and the summed resident memory of every java and
      # python process every 2 s, and prints the peaks.
      - name: Core gate, every assertion in one run
        working-directory: forseti
        env:
          JAVA_TOOL_OPTIONS: -Dforseti.gate.horizonXmx=6g
          FORSETI_GATE_JAVA_OPTS: -Xmx6g -Xlog:gc:file=build/memory/gate-gc.log:uptime
        run: |
          mkdir -p build/memory
          (while sleep 2; do echo "$(date +%s) $(ps -e -o rss=,comm= | awk '$2 ~ /^(java|python)/ {s += $1} END {print s + 0}')"; done) > build/memory/rss-kib.txt &
          sampler=$!
          set +e
          bash scripts/gate-then-promote.sh build/gate "$(command -v python)"
          rc=$?
          set -e
          kill "$sampler"
          echo "peak summed RSS of java and python: $(awk '$2 > m {m = $2} END {printf "%.2f GiB", m / 1048576}' build/memory/rss-kib.txt)"
          echo "peak gate heap after GC: $(sed -nE 's/.*->([0-9]+)M\(.*/\1/p' build/memory/gate-gc.log | sort -n | tail -1) MiB"
          exit "$rc"
      - name: Gate report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-core-gate
          path: |
            forseti/build/gate/
            forseti/build/memory/
          if-no-files-found: error
