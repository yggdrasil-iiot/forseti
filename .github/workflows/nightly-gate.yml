name: nightly unsharded core gate
# The same core gate in one unsharded run (every assertion, scenario and cut in one JVM): the equivalence check for the sharded
# layout of ci.yml. Not a pull-request check; it runs once a day and on demand.
on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  gate:
    name: core gate, unsharded
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {path: forseti}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: {java-version: '17.0.21', distribution: temurin, cache: maven}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.13.18'}
      - name: Install the oracle
        working-directory: forseti/oracle
        run: python -m pip install -e ".[dev]"
      - name: Build the jar
        working-directory: forseti
        run: mvn -B -ntp install -DskipTests
      - name: Core gate, every assertion in one run
        working-directory: forseti
        run: java -Dforseti.gate.horizonXmx=6g -jar cli/target/forseti.jar gate --engine core --out build/gate --state build/gate/state --python "$(command -v python)"
      - name: Gate report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: nightly-core-gate, path: forseti/build/gate/, if-no-files-found: error}
