name: nightly unsharded gates
# The same core gate in one unsharded run (every assertion, scenario and cut in one JVM): the equivalence check for the sharded
# layout of ci.yml. The Flink replay gate likewise unsharded, its three-run determinism (comparison item 6) and forseti requirements
# (spec 705, plan D13, D14). Not a pull-request check; it runs once a day and on demand.
on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  gate:
    name: core gate, unsharded
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {path: forseti}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: {java-version: '17.0.21', distribution: temurin, cache: maven}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.13.18'}
      - name: Install the oracle
        working-directory: forseti/oracle
        run: python -m pip install -e ".[dev]"
      - name: Build the jar
        working-directory: forseti
        run: mvn -B -ntp install -DskipTests
      - name: Core-input key
        working-directory: forseti
        run: echo "FORSETI_INPUT_KEY=$(bash scripts/core-input-key.sh)" >> "$GITHUB_ENV"
      # The gate's own JVM gets an explicit 6g heap (the runner default is a quarter of its RAM); the harness children keep the heaps the
      # gate gives them on their command lines. The step records the gate JVM's GC log and the summed resident memory of every java and
      # python process every 2 s, and prints the peaks.
      - name: Core gate, every assertion in one run
        working-directory: forseti
        env:
          JAVA_TOOL_OPTIONS: -Dforseti.gate.horizonXmx=6g
          FORSETI_GATE_JAVA_OPTS: -Xmx6g -Xlog:gc:file=build/memory/gate-gc.log:uptime
        run: |
          mkdir -p build/memory
          (while sleep 2; do echo "$(date +%s) $(ps -e -o rss=,comm= | awk '$2 ~ /^(java|python)/ {s += $1} END {print s + 0}')"; done) > build/memory/rss-kib.txt &
          sampler=$!
          set +e
          bash scripts/gate-then-promote.sh build/gate "$(command -v python)"
          rc=$?
          set -e
          kill "$sampler"
          echo "peak summed RSS of java and python: $(awk '$2 > m {m = $2} END {printf "%.2f GiB", m / 1048576}' build/memory/rss-kib.txt)"
          echo "peak gate heap after GC: $(sed -nE 's/.*->([0-9]+)M\(.*/\1/p' build/memory/gate-gc.log | sort -n | tail -1) MiB"
          exit "$rc"
      - name: Gate report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-core-gate
          path: |
            forseti/build/gate/
            forseti/build/memory/
          if-no-files-found: error
  # The Flink launcher and engine path, packaged once so every Flink job of the night runs the same engine artifact.
  flink-package:
    name: flink, package the launcher and the engine path
    runs-on: ubuntu-latest
    outputs:
      determinism: ${{ steps.plan.outputs.determinism }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {path: forseti}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: {java-version: '17.0.21', distribution: temurin, cache: maven}
      - name: Package the launcher and the engine path, tests skipped here
        working-directory: forseti
        run: mvn -B -ntp install -DskipTests
      # comparison item 6 runs on every shard of the plan: the hand-made, restart and horizon shards
      - name: Determinism shards
        id: plan
        working-directory: forseti
        run: echo "determinism=$(python3 -I -c 'import json;print(json.dumps([s["name"] for s in json.load(open("gate/flink-shards.json"))["shards"]]))')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-flink-engine
          path: |
            forseti/cli/target/forseti.jar
            forseti/engine-flink/target/engine/
          if-no-files-found: error
  # The Flink replay gate in one unsharded run: every scenario, generation run, restart run and assertion of gate/flink-shards.json in
  # one process, each run with the engine settings of the first shard that plans it (a horizon recording keeps its shard's heap). The step
  # records the summed resident memory of every java and python process every 2 s and prints the peak.
  flink-gate:
    name: flink gate, unsharded
    needs: [flink-package]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {path: forseti}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: {java-version: '17.0.21', distribution: temurin}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.13.18'}
      - name: Install the oracle
        working-directory: forseti/oracle
        run: python -m pip install -e ".[dev]"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: nightly-flink-engine, path: forseti}
      - name: Flink gate, every assertion in one run
        working-directory: forseti
        run: |
          mkdir -p build/memory
          (while sleep 2; do echo "$(date +%s) $(ps -e -o rss=,comm= | awk '$2 ~ /^(java|python)/ {s += $1} END {print s + 0}')"; done) > build/memory/flink-rss-kib.txt &
          sampler=$!
          set +e
          java -Xmx4g -Dforseti.engine.path=engine-flink/target/engine -jar cli/target/forseti.jar gate --engine flink --out build/flink --python "$(command -v python)"
          rc=$?
          set -e
          kill "$sampler"
          echo "peak summed RSS of java and python: $(awk '$2 > m {m = $2} END {printf "%.2f GiB", m / 1048576}' build/memory/flink-rss-kib.txt)"
          exit "$rc"
      - name: Flink gate report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-flink-gate
          path: |
            forseti/build/flink/
            forseti/build/memory/
          if-no-files-found: error
  # Comparison item 6 (spec 598): each shard of the plan run three times, each execution its own broker and clusters, then the bodies of
  # every run compared at every comparable cut of every pair of executions (forseti determinism; the fingerprints are of the bodies, so
  # run ids, topic names, paths and checkpoint ids never enter the comparison; a restart run compares at the cuts both executions completed).
  flink-determinism:
    name: flink determinism ${{ matrix.shard }}
    needs: [flink-package]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.flink-package.outputs.determinism) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {path: forseti}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: {java-version: '17.0.21', distribution: temurin}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.13.18'}
      - name: Install the oracle
        working-directory: forseti/oracle
        run: python -m pip install -e ".[dev]"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: nightly-flink-engine, path: forseti}
      - name: Three executions, then the comparison
        working-directory: forseti
        env: {SHARD: "${{ matrix.shard }}"}
        run: |
          d="build/determinism/$SHARD"
          for i in 1 2 3; do
            set +e
            java -Xmx3g -Dforseti.engine.path=engine-flink/target/engine -jar cli/target/forseti.jar gate --engine flink --shard "$SHARD" --out "$d/run-$i" --python "$(command -v python)"
            echo "execution $i exit $?"
            set -e
          done
          java -jar cli/target/forseti.jar determinism --runs "$d/run-1,$d/run-2,$d/run-3" --out "$d"
      - name: Determinism report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: "nightly-flink-determinism-${{ matrix.shard }}", path: forseti/build/determinism/, if-no-files-found: error}
  # forseti requirements against the unsharded gate's report (plan D14): it exits 0 when every requirement is recorded, a miss included.
  flink-requirements:
    name: flink requirements
    needs: [flink-package, flink-gate]
    if: ${{ !cancelled() && needs.flink-package.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {path: forseti}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: {java-version: '17.0.21', distribution: temurin}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.13.18'}
      - name: Install the oracle
        working-directory: forseti/oracle
        run: python -m pip install -e ".[dev]"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: nightly-flink-engine, path: forseti}
      # the unsharded gate's report; when it is absent (the gate timed out or failed before writing it) the requirements still run and
      # record the gate-derived requirements as errors
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with: {name: nightly-flink-gate, path: forseti/build/nightly}
      - name: Requirements
        working-directory: forseti
        run: |
          java -Xmx3g -Dforseti.engine.path=engine-flink/target/engine -jar cli/target/forseti.jar requirements --engine flink \
            --gate-report build/nightly/flink/report.json --out build/requirements --python "$(command -v python)"
      - name: Requirements report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: nightly-flink-requirements, path: forseti/build/requirements/, if-no-files-found: error}
