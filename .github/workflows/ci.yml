name: CI
on:
  push: {branches: [main]}
  pull_request:
  workflow_dispatch:
permissions: {contents: read}
# A newer push to the same pull request cancels the older run; pushes to main always run to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# Actions pinned to full commit SHAs: checkout v4, setup-java v4, setup-python v5, upload-artifact v4.
jobs:
  build:
    name: core + cli tests, oracle tests
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.shards.outputs.names }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {path: forseti}
      - name: Product names in ASCII
        working-directory: forseti
        run: bash scripts/check-ascii-names.sh
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: {java-version: '17.0.21', distribution: temurin, cache: maven}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.13.18'}
      - name: Install the oracle
        working-directory: forseti/oracle
        run: python -m pip install -e ".[dev]"
      - name: Oracle tests
        working-directory: forseti/oracle
        run: python -m pytest -q
      - name: Build and test (core, cli)
        working-directory: forseti
        run: mvn -B -ntp install
      - name: Dependency closure
        working-directory: forseti
        run: bash scripts/check-dependency-closure.sh
      - name: Gate shards
        id: shards
        working-directory: forseti
        run: echo "names=$(python -I -c 'import json;print(json.dumps([s["name"] for s in json.load(open("gate/core-shards.json"))["shards"]]))')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: forseti-jar, path: forseti/cli/target/forseti.jar, if-no-files-found: error}
  # The core gate in shards (gate/core-shards.json): each horizon recording in its own job, the hand-made scenarios in one; every
  # scenario is still compared with the oracle at every cut. Each shard registers its generations through `generation new` into its
  # own store, build/shards/<shard>/state, inside the uploaded path: the artifact holds report.json, summaries.json, logs/, diffs/ (on
  # failure), runs/*.run.json, runs/*.cuts.json and state/ (upload-artifact leaves out the hidden head-floors/.lock, which FloorStore
  # recreates; no lock file is evidence). The core-gate job below passes only when every shard ran and held.
  gate:
    name: core gate shard ${{ matrix.shard }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.build.outputs.shards) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {path: forseti}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: {java-version: '17.0.21', distribution: temurin}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.13.18'}
      - name: Install the oracle
        working-directory: forseti/oracle
        run: python -m pip install -e ".[dev]"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: forseti-jar, path: forseti/cli/target}
      - name: Core gate shard
        working-directory: forseti
        run: java -Dforseti.gate.horizonXmx=6g -jar cli/target/forseti.jar gate --engine core --shard "${{ matrix.shard }}" --out "build/shards/${{ matrix.shard }}" --state "build/shards/${{ matrix.shard }}/state" --python "$(command -v python)"
      - name: Shard report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: "gate-shard-${{ matrix.shard }}", path: forseti/build/shards/, if-no-files-found: error}
  core-gate:
    name: core gate, every assertion, scenario and cut
    needs: [build, gate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Build and every shard job succeeded
        if: needs.build.result != 'success' || needs.gate.result != 'success'
        run: |
          echo "build: ${{ needs.build.result }}; gate shards: ${{ needs.gate.result }}"
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {path: forseti}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: {java-version: '17.0.21', distribution: temurin}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.13.18'}
      - name: Install the oracle
        working-directory: forseti/oracle
        run: python -m pip install -e ".[dev]"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: forseti-jar, path: forseti/cli/target}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {pattern: gate-shard-*, path: forseti/build/shards, merge-multiple: true}
      - name: Core gate over every shard
        working-directory: forseti
        run: java -jar cli/target/forseti.jar gate --engine core --aggregate build/shards --out build/gate --python "$(command -v python)"
      - name: Negative controls exit 1 for their intended assertion
        working-directory: forseti
        run: |
          for c in $(python -I -c 'import json;print(" ".join(json.load(open("gate/core-negative-controls.json"))["controls"]))'); do
            set +e; java -jar cli/target/forseti.jar gate --engine core --negative-control "$c" --out "build/gate-$c" --python "$(command -v python)"; rc=$?; set -e
            [ "$rc" -eq 1 ] || { echo "negative control $c exited $rc, expected 1"; exit 1; }
            python -I -c "import json,sys;r=json.load(open('build/gate-$c/report.json'));sys.exit(0 if set(r['intendedFailures'])<=set(r['failed']) else 1)" || { echo "$c did not fail its intended assertion"; exit 1; }
          done
      - name: Gate reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: core-gate, path: forseti/build/gate*/, if-no-files-found: error}
  bifrost-seam:
    name: release reader against a head Bifrost publishes now
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {path: forseti}
      - id: pins
        working-directory: forseti
        run: |
          echo "bifrost=$(python3 -c 'import json;print(json.load(open("fixtures/registry.lock.json"))["bifrost"])')" >> "$GITHUB_OUTPUT"
          echo "tyr=$(python3 -c 'import json;print(json.load(open("fixtures/registry.lock.json"))["tyr"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {repository: yggdrasil-iiot/bifrost, path: bifrost, ref: "${{ steps.pins.outputs.bifrost }}"}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {repository: yggdrasil-iiot/tyr, path: tyr, ref: "${{ steps.pins.outputs.tyr }}"}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: {java-version: '17.0.21', distribution: temurin, cache: maven}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.13.18'}
      - name: Build Bifrost's gates CLI
        working-directory: bifrost
        run: mvn -B -ntp -pl gates -am package -DskipTests
      - name: Seam test
        working-directory: forseti
        env: {FORSETI_BIFROST_JAR: ../bifrost/gates/target/bifrost-gates.jar, FORSETI_TYR_FIXTURES: ../tyr/fixtures/attribution-rule}
        run: mvn -B -ntp -pl core -am -Dtest=BifrostSeamTest -Dsurefire.failIfNoSpecifiedTests=false test
  windows:
    name: tests on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: {java-version: '17.0.21', distribution: temurin, cache: maven}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.13'}  # no 3.13.18 build for Windows; the pins the aggregate compares come from the ubuntu shard jobs
      - run: python -m pip install -e "oracle[dev]"
      - run: python -m pytest -q oracle
      - run: mvn -B -ntp install
