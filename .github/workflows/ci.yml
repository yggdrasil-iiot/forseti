name: CI
on:
  push: {branches: [main]}
  pull_request:
  workflow_dispatch:
permissions: {contents: read}
# A newer push to the same pull request cancels the older run; pushes to main always run to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# Actions pinned to full commit SHAs: checkout v4, setup-java v4, setup-python v5, upload-artifact v4.
jobs:
  # The jar, packaged without running the tests (they run in the test jobs below, in parallel with the gate), the plan outputs and the
  # core-input key (scripts/core-input-key.sh) every gate run records in pins.forseti.inputKey.
  package:
    name: package the jar
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.shards.outputs.names }}
      controls: ${{ steps.controls.outputs.runs }}
      control-aggregates: ${{ steps.controls.outputs.aggregates }}
      input-key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {path: forseti}
      - name: Product names in ASCII
        working-directory: forseti
        run: bash scripts/check-ascii-names.sh
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: {java-version: '17.0.21', distribution: temurin, cache: maven}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.13.18'}
      - name: Package (core, cli), tests skipped here
        working-directory: forseti
        run: mvn -B -ntp install -DskipTests
      - name: Core-input key
        id: key
        working-directory: forseti
        run: echo "key=$(bash scripts/core-input-key.sh)" >> "$GITHUB_OUTPUT"
      - name: Gate shards
        id: shards
        working-directory: forseti
        run: echo "names=$(python -I -c 'import json;print(json.dumps([s["name"] for s in json.load(open("gate/core-shards.json"))["shards"]]))')" >> "$GITHUB_OUTPUT"
      # The control runs, one per (control, shard) of gate/core-negative-controls.json (the gate refuses a shard the file does not give
      # the control), and the controls with an intended id of the plan's aggregate list, which an aggregate control run proves.
      - name: Negative control runs
        id: controls
        working-directory: forseti
        run: |
          python -I - >> "$GITHUB_OUTPUT" <<'PY'
          import json
          c = json.load(open("gate/core-negative-controls.json"))["controls"]
          agg = set(json.load(open("gate/core-shards.json"))["aggregate"])
          print("runs=" + json.dumps([{"control": x["name"], "shard": s} for x in c for s in x["shards"]]))
          print("aggregates=" + json.dumps([x["name"] for x in c if agg & set(x["intended"])]))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: forseti-jar, path: forseti/cli/target/forseti.jar, if-no-files-found: error}
  # The core gate in shards (gate/core-shards.json): each horizon recording in its own job, the hand-made scenarios in one; every
  # scenario is still compared with the oracle at every cut. Each shard registers its generations through `generation new` into its
  # own store, build/shards/<shard>/state, inside the uploaded path: the artifact holds report.json, summaries.json, logs/, diffs/ (on
  # failure), runs/*.run.json, runs/*.cuts.json, journals/ (kept for a scenario with a generation run) and state/ (upload-artifact leaves out the hidden head-floors/.lock, which FloorStore
  # recreates; no lock file is evidence). The core-gate job below passes only when every shard ran and held.
  gate:
    name: core gate shard ${{ matrix.shard }}
    needs: package
    env: {FORSETI_INPUT_KEY: "${{ needs.package.outputs.input-key }}"}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.package.outputs.shards) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {path: forseti}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: {java-version: '17.0.21', distribution: temurin}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.13.18'}
      - name: Install the oracle
        working-directory: forseti/oracle
        run: python -m pip install -e ".[dev]"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: forseti-jar, path: forseti/cli/target}
      - name: Core gate shard
        working-directory: forseti
        run: java -Xmx4g -Dforseti.gate.horizonXmx=6g -jar cli/target/forseti.jar gate --engine core --shard "${{ matrix.shard }}" --out "build/shards/${{ matrix.shard }}" --state "build/shards/${{ matrix.shard }}/state" --python "$(command -v python)"
      - name: Shard report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: "gate-shard-${{ matrix.shard }}", path: forseti/build/shards/, if-no-files-found: error}
  # Negative controls (spec Negative controls; owner decision of 2026-11-12): each control runs only on the shards that own or feed its
  # intended ids, against the same manifest, shard plan, fixtures, seed and jar, without --state (every generation isolated, so a control
  # report never authorizes a promotion). A run passes here only when it exits 1 (0 is allowed only for a shard that owns none of the
  # control's intended ids and only feeds an aggregate one), its report is that control's shard run, its intended ids are a subset of
  # its failed ones, and its control verdict holds: no crash, no missing run, every cut compared with the oracle.
  control:
    name: negative control ${{ matrix.run.control }} on shard ${{ matrix.run.shard }}
    needs: package
    env: {FORSETI_INPUT_KEY: "${{ needs.package.outputs.input-key }}"}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        run: ${{ fromJSON(needs.package.outputs.controls) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {path: forseti}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: {java-version: '17.0.21', distribution: temurin}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.13.18'}
      - name: Install the oracle
        working-directory: forseti/oracle
        run: python -m pip install -e ".[dev]"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: forseti-jar, path: forseti/cli/target}
      - name: Control run
        working-directory: forseti
        env: {CONTROL: "${{ matrix.run.control }}", SHARD: "${{ matrix.run.shard }}"}
        run: |
          set +e
          java -Xmx4g -Dforseti.gate.horizonXmx=6g -jar cli/target/forseti.jar gate --engine core --negative-control "$CONTROL" --shard "$SHARD" \
            --out "build/controls/$CONTROL/$SHARD" --python "$(command -v python)"
          rc=$?
          set -e
          python -I scripts/check-control-report.py "build/controls/$CONTROL/$SHARD/report.json" "$rc" "$CONTROL" "$SHARD"
      - name: Control report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: "control--${{ matrix.run.control }}--${{ matrix.run.shard }}", path: forseti/build/controls/, if-no-files-found: error}
  # A control whose intended ids include an aggregate id (drop-late: J-DISPOSITION-COVERAGE; no-cascade: J-BASIS-CURRENT) is proved by
  # an aggregate control run over that control's shard runs only: it requires each to be that control's held shard run, evaluates the
  # aggregate assertions over their summaries, and must exit 1 with its intended aggregate ids in failed and its verdict held.
  control-aggregate:
    name: negative control ${{ matrix.control }} over its shards
    needs: [package, control]
    if: always() && needs.package.result == 'success'
    env: {FORSETI_INPUT_KEY: "${{ needs.package.outputs.input-key }}"}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        control: ${{ fromJSON(needs.package.outputs.control-aggregates) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {path: forseti}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: {java-version: '17.0.21', distribution: temurin}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.13.18'}
      - name: Install the oracle
        working-directory: forseti/oracle
        run: python -m pip install -e ".[dev]"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: forseti-jar, path: forseti/cli/target}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {pattern: "control--${{ matrix.control }}--*", path: forseti/build/controls, merge-multiple: true}
      - name: Aggregate control run
        working-directory: forseti
        env: {CONTROL: "${{ matrix.control }}"}
        run: |
          set +e
          java -jar cli/target/forseti.jar gate --engine core --aggregate "build/controls/$CONTROL" --negative-control "$CONTROL" \
            --out "build/control-aggregate/$CONTROL" --python "$(command -v python)"
          rc=$?
          set -e
          python -I scripts/check-control-report.py "build/control-aggregate/$CONTROL/report.json" "$rc" "$CONTROL" aggregate
      - name: Aggregate control report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: "control-aggregate--${{ matrix.control }}", path: forseti/build/control-aggregate/, if-no-files-found: error}
  core-gate:
    name: core gate, every assertion, scenario and cut
    needs: [package, tests, test-split, gate, control, control-aggregate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Package, every test, shard and control job succeeded
        if: needs.package.result != 'success' || needs.tests.result != 'success' || needs.test-split.result != 'success' || needs.gate.result != 'success' || needs.control.result != 'success' || needs.control-aggregate.result != 'success'
        run: |
          echo "package: ${{ needs.package.result }}; tests: ${{ needs.tests.result }}; test split: ${{ needs.test-split.result }}; gate shards: ${{ needs.gate.result }}; controls: ${{ needs.control.result }}; control aggregates: ${{ needs.control-aggregate.result }}"
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {path: forseti}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: {java-version: '17.0.21', distribution: temurin}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.13.18'}
      - name: Install the oracle
        working-directory: forseti/oracle
        run: python -m pip install -e ".[dev]"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: forseti-jar, path: forseti/cli/target}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {pattern: gate-shard-*, path: forseti/build/shards, merge-multiple: true}
      # The aggregate run's own key, computed on this job's checkout (not taken from the package job): the aggregate refuses any shard
      # report whose pins carry another key or that ran from unpacked classes.
      - name: Core-input key of this checkout
        working-directory: forseti
        run: echo "FORSETI_INPUT_KEY=$(bash scripts/core-input-key.sh)" >> "$GITHUB_ENV"
      - name: Core gate over every shard, then promote through the CLI
        working-directory: forseti
        run: bash scripts/gate-then-promote.sh --from-shards build/shards build/gate "$(command -v python)"
      - name: An unlisted negative control is a usage error
        working-directory: forseti
        run: |
          set +e; java -jar cli/target/forseti.jar gate --engine core --negative-control no-such-control --out build/gate-no-such-control; rc=$?; set -e
          [ "$rc" -eq 2 ] || { echo "an unlisted negative control exited $rc, expected 2"; exit 1; }
      - name: Gate reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-gate
          path: |
            forseti/build/gate*/
            forseti/build/shards/horizon-planned-late/state/
          if-no-files-found: error
  bifrost-seam:
    name: release reader against a head Bifrost publishes now
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {path: forseti}
      - id: pins
        working-directory: forseti
        run: |
          echo "bifrost=$(python3 -c 'import json;print(json.load(open("fixtures/registry.lock.json"))["bifrost"])')" >> "$GITHUB_OUTPUT"
          echo "tyr=$(python3 -c 'import json;print(json.load(open("fixtures/registry.lock.json"))["tyr"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {repository: yggdrasil-iiot/bifrost, path: bifrost, ref: "${{ steps.pins.outputs.bifrost }}"}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {repository: yggdrasil-iiot/tyr, path: tyr, ref: "${{ steps.pins.outputs.tyr }}"}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: {java-version: '17.0.21', distribution: temurin, cache: maven}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.13.18'}
      - name: Build Bifrost's gates CLI
        working-directory: bifrost
        run: mvn -B -ntp -pl gates -am package -DskipTests
      - name: Seam test
        working-directory: forseti
        env: {FORSETI_BIFROST_JAR: ../bifrost/gates/target/bifrost-gates.jar, FORSETI_TYR_FIXTURES: ../tyr/fixtures/attribution-rule}
        run: mvn -B -ntp -pl core -am -Dtest=BifrostSeamTest -Dsurefire.failIfNoSpecifiedTests=false test
  # Every Java test and the oracle suite, on Linux and on Windows, split into parallel groups. NegativeControlsTest holds the slow
  # in-process control runs (one JVM-wide system property each, so they cannot share a JVM in parallel): three groups take its methods
  # by name, `rest` takes every other test class and the oracle suite. test-split checks that together they ran every declared test
  # method exactly once on each OS.
  tests:
    name: tests ${{ matrix.os }} ${{ matrix.group }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        os: [linux, windows]
        group: [controls-a, controls-b, controls-c, rest]
        include:
          - {os: linux, runner: ubuntu-latest, python: '3.13.18'}
          - {os: windows, runner: windows-latest, python: '3.13'}   # no 3.13.18 build for Windows; the gate pins come from the ubuntu jobs
          - {group: controls-a, tests: 'NegativeControlsTest#stationGranularityFailsI16+lenientOracleFailsI2'}
          - {group: controls-b, tests: 'NegativeControlsTest#'}
          - {group: controls-c, tests: 'NegativeControlsTest#ignoreSessionGapFailsI8+noCascadeFailsI18AndLeavesAStaleBasis+wrongRulesPinFailsThePinsCrossCheck'}
          - {group: rest, tests: '!NegativeControlsTest'}
    defaults:
      run: {shell: bash}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: {java-version: '17.0.21', distribution: temurin, cache: maven}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '${{ matrix.python }}'}
      - run: python -m pip install -e "oracle[dev]"
      - name: Oracle tests
        if: matrix.group == 'rest'
        run: python -m pytest -q oracle
      - name: Java tests of the group
        run: mvn -B -ntp install "-Dtest=${{ matrix.tests }}" -Dsurefire.failIfNoSpecifiedTests=false
      - name: Dependency closure
        if: matrix.group == 'rest' && matrix.os == 'linux'
        run: bash scripts/check-dependency-closure.sh
      - name: Surefire reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: "surefire-${{ matrix.os }}-${{ matrix.group }}", path: "*/target/surefire-reports/TEST-*.xml", if-no-files-found: error}
  test-split:
    name: every test ran exactly once on each OS
    needs: tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {pattern: surefire-linux-*, path: build/surefire/linux}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {pattern: surefire-windows-*, path: build/surefire/windows}
      - name: Linux
        run: python3 -I scripts/check-test-split.py build/surefire/linux core/src/test cli/src/test
      - name: Windows
        if: always()
        run: python3 -I scripts/check-test-split.py build/surefire/windows core/src/test cli/src/test
