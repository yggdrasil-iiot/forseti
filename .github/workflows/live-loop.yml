name: live loop
# The step-5 full loop (docs/LIVE-LOOP.md): HiveMQ CE and Kafka from live/docker-compose.yml, the Bifrost sim and five Muninn built
# from the commits live/stack-lock.json locks, the bridge, the driver and the recorder, then verify-capture, the core harness and the
# oracle on the capture. Not a pull-request check: it runs nightly and on demand, uploads the run directory and never commits.
on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      placement:
        description: dedicated or shared
        type: choice
        options: [dedicated, shared]
        default: dedicated
      scenario:
        description: a scenario file under fixtures/live-scenarios/
        type: string
        default: fixtures/live-scenarios/baseline.json
permissions: {contents: read}
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  full-loop:
    name: full loop
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PLACEMENT: ${{ inputs.placement || 'dedicated' }}
      SCENARIO: ${{ inputs.scenario || 'fixtures/live-scenarios/baseline.json' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {path: forseti}
      - name: Locked upstream commits
        id: lock
        working-directory: forseti
        run: |
          echo "bifrost=$(jq -r '.jars["bifrost-sim"].commit' live/stack-lock.json)" >> "$GITHUB_OUTPUT"
          echo "muninn=$(jq -r '.jars.muninn.commit' live/stack-lock.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {repository: yggdrasil-iiot/bifrost, ref: "${{ steps.lock.outputs.bifrost }}", path: bifrost}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {repository: yggdrasil-iiot/muninn, ref: "${{ steps.lock.outputs.muninn }}", path: muninn}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: {java-version: '17.0.21', distribution: temurin, cache: maven, cache-dependency-path: forseti/pom.xml}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.13.18'}
      - name: Install the oracle
        working-directory: forseti/oracle
        run: python -m pip install -e ".[dev]"
      - name: Build forseti
        working-directory: forseti
        run: mvn -B -ntp install -DskipTests
      # The jars are built from the locked commits with the commit time as project.build.outputTimestamp; the script refuses a jar
      # whose SHA-256 is not the lock's.
      - name: Build the locked sim and Muninn jars
        working-directory: forseti
        run: bash scripts/build-live-jars.sh ../bifrost ../muninn build/live-jars
      - name: Full loop
        working-directory: forseti
        run: bash scripts/run-full-loop-gate.sh --placement "$PLACEMENT" --scenario "$SCENARIO" --out build/full-loop/run --python "$(command -v python)"
      - name: Run directory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: live-loop-run, path: forseti/build/full-loop/, if-no-files-found: error}
